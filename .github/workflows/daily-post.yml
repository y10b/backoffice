name: 매일 블로그 초안

# !! 키워드 수집 2주 동안은 이 워크플로를 꺼둔다 (gh workflow disable). !!
#    keywords.yml 로 모은 키워드를 보고 채널별 주제·시드를 다시 정한 뒤 켠다.
#
# 채널(naver · tistory)마다 하루 한 편. 예전에는 Gemini 키 수만큼 여러 편을 만들었는데
# 사람이 매일 손질해 올릴 수 있는 양은 한 편이라 초안만 쌓였다.
#
# 예전에는 배포본의 /api/cron/daily-post 를 curl 로 불렀다. 이제 개발 로그 · 키워드 수집과
# 같은 방식으로 러너에서 scripts/daily-post.mjs 를 직접 돌린다 — 배포 상태 · CRON_SECRET ·
# Vercel 300초 상한과 무관해진다. 로직은 src/lib/dailyPost.ts 한 곳이다.
#
# 크론은 UTC 다. 21:30 UTC = 06:30 KST — 06:00 키워드 수집 뒤에 돈다.
#
# 이 레포는 공개라 실행 로그도 공개다. 스크립트는 채널 · 키워드 · 숫자만 찍는다.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "어느 채널"
        required: true
        default: "all"
        type: choice
        options: [all, naver, tistory]
      seed:
        description: "시드 키워드 (비우면 날짜 기준으로 자동 선택). 채널을 하나 골랐을 때만 쓴다"
        required: false
        type: string

permissions: {}

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    # 그라운딩 + 본문 생성 + 503 재시도. 기본 6시간은 과하다
    timeout-minutes: 15
    strategy:
      # 한 채널이 실패해도 다른 채널 글은 나와야 한다
      fail-fast: false
      matrix:
        # 수동 실행에서 채널을 하나 고르면 그것만, 아니면(크론 포함) 둘 다
        channel: ${{ fromJSON((inputs.channel == 'naver' || inputs.channel == 'tistory') && format('["{0}"]', inputs.channel) || '["naver","tistory"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # src/lib 의 .ts 를 그대로 읽어야 해서 타입 스트리핑이 되는 버전이 필요하다
          node-version: "24"
          cache: npm

      - name: 의존성 설치
        run: npm ci --omit=dev

      - name: 초안 작성
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
          NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
          NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CHANNEL: ${{ matrix.channel }}
          # 시드는 채널을 하나 골랐을 때만 넘긴다. 두 채널에 같은 시드를 쓰면 주제가 섞인다
          SEED: ${{ (inputs.channel == 'naver' || inputs.channel == 'tistory') && inputs.seed || '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL 과 SUPABASE_SERVICE_ROLE_KEY 시크릿을 등록하세요."
            exit 1
          fi
          status=0
          node --import ./scripts/ts-register.mjs scripts/daily-post.mjs "$CHANNEL" ${SEED:+"$SEED"} > summary.md 2>&1 || status=$?
          cat summary.md
          {
            echo "## $CHANNEL"
            echo
            cat summary.md
            echo
            echo "백오피스 **글 목록**에서 확인하고 발행하세요."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
