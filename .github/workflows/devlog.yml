name: 개발 로그 (velog)

# 원래 y10b/devlog 레포의 워크플로 네 개였다. 백오피스로 옮기면서 하나로 합쳤다.
#
# 제휴 후보 워크플로와 같은 방식이다 — 배포본 API 를 부르지 않고 러너 안에서 스크립트를
# 직접 돌린다. 배포·머지·CRON_SECRET 과 무관하게 이 파일이 있는 브랜치에서 바로 돈다.
# 자격증명(GitHub 토큰 · velog 쿠키)은 백오피스 설정 표에 있으니 러너는 DB 접속만 알면 된다.
#
#   매일 21:00 KST  collect  그날 커밋 수집 (회사 레포 제외)
#   매일 22:00      sync     velog 에 올라간 글·반응을 되돌려 채움
#   매일 22:30      draft    최근 커밋에서 글감 하나 → velog 초안 (검토 대기)
#   매일 07:00      publish  '발행 승인' 상태만 velog 에 올림
#
# 초안은 매일이다. 사람이 매일 검토하기로 했으니 빈도는 사람이 조절한다 —
# 커밋이 없거나 글감 점수가 낮은 날은 여전히 아무것도 만들지 않는다.
#
# 크론은 UTC 다. GitHub 크론은 부하에 따라 수십 분 늦게 도는 일이 흔하다.
#
# 이 레포는 공개라 실행 로그도 공개다. 스크립트는 개수만 찍는다 — 레포 이름과 초안 제목은
# 백오피스 화면에서 본다.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 22 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "collect · draft · publish · sync"
        required: true
        default: "collect"
        type: choice
        options: [collect, draft, publish, sync]
      date:
        description: "collect 만: YYYY-MM-DD (비우면 오늘)"
        required: false
        type: string

permissions: {}

# 수동 실행과 크론이 겹치면 발행이 두 번 갈 수 있다. 한 번에 하나만 돈다
concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 어떤 단계인지 정하기
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          case "$SCHEDULE" in
            "0 12 * * *") task=collect ;;
            "30 13 * * *") task=draft ;;
            "0 22 * * *") task=publish ;;
            "0 13 * * *") task=sync ;;
            *) task="${INPUT_TASK:-collect}" ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # src/lib 의 .ts 를 그대로 읽어야 해서 타입 스트리핑이 되는 버전이 필요하다
          node-version: "24"
          cache: npm

      - name: 의존성 설치
        run: npm ci --omit=dev

      - name: 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 초안 본문. 없으면 뼈대만 만든다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TASK: ${{ steps.pick.outputs.task }}
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL 과 SUPABASE_SERVICE_ROLE_KEY 시크릿을 등록하세요."
            exit 1
          fi
          node --import ./scripts/ts-register.mjs scripts/devlog.mjs "$TASK" ${DATE:+"$DATE"} | tee summary.md
          {
            echo "## $TASK"
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"
